[project]
name = "pet-hospital-mcp"
version = "1.0.0"
description = "MCP Server for Pet Hospital REST API (2026-07-28 protocol)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pet-hospital-mcp = "server:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["server", "pet_hospital_client"]
exclude = ["test*", "*.log"]
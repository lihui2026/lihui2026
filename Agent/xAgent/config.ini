; xAgent 配置文件
; 修改后需要重新启动 xAgent 才能生效。

[LLM]
base_url = http://127.0.0.1:1234/v1
model = deepseek-qwen-modelstock-2b
api_key = dummy
; 可选：手动指定模型上下文窗口大小（Token）。0 表示自动探测，探测失败时使用 default_context_window。
context_window = 0
; 请求超时（秒）
timeout = 120
; /models 探测超时（秒）
models_timeout = 8
; 无法探测上下文窗口时使用的默认值（Token）
default_context_window = 128000
; 上下文占用比例达到该值时暂停接收新提示词（0.6 = 60%）
compact_threshold = 0.6
; 压缩摘要的目标 Token 数
summary_target_tokens = 5000
; 压缩时单条消息内容的最大字符数
compaction_message_char_limit = 20000
; 单次请求最多允许的工具调用轮次
max_tool_rounds = 5
; System Prompt 中 MCP 工具描述的截断长度
mcp_tool_description_limit = 300

[MCP]
; 单个 MCP Server 连接超时（秒）
connect_timeout = 30
; MCP 工具调用超时（秒）
call_timeout = 120
; MCP 工具输出最大字符数
output_limit = 20000

[TOOLS]
; 普通工具执行超时（秒）
tool_timeout = 10
; RunCli 命令执行超时（秒）
cli_timeout = 30
; RunCli 输出最大字符数
cli_output_limit = 6000
; fetchWeb 的 curl 连接超时 / 最大耗时 / 进程超时（秒）
fetch_connect_timeout = 10
fetch_max_timeout = 30
fetch_timeout = 40
; searchWeb 请求超时（秒）
search_timeout = 30
; recallContext 检索结果控制
recall_max_hits = 8
recall_snippet_chars = 400
recall_total_chars = 6000
; 自动生成 Skill 描述时的截断长度
skill_description_limit = 200

[search]
; 百度千帆搜索 API Key（searchWeb 工具使用）
baidu_qianfan_api_key = api key

[SESSION]
; 会话事件日志目录（相对于启动目录）
dir = .agents/sessions
; 每条消息是否立即写入会话文件
auto_save = true
; /resume 列表最多显示的会话数
list_limit = 50

[UI]
; MCP 侧栏宽度（字符数）
sidebar_width = 34
; 命令补全面板最多显示的命令数
command_palette_max = 8
